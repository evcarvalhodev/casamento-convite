<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f1e9">
<title>Entrar · Pode Abrir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #f6f1e9; --card: #fffdf9; --line: #e4dacb; --ink: #1f1a14; --soft: #6f6456; --gold: #9a7a46; --gold-bg: #f3e8d4; --erro: #b3372c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
.caixa { width: 100%; max-width: 400px; text-align: center; }
.marca { font-family: "Instrument Serif", serif; font-size: 30px; text-decoration: none; color: var(--ink); }
.marca em { color: var(--gold); }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 30px 22px; margin-top: 22px; text-align: left; }
h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 36px; line-height: 1.05; }
p.sub { color: var(--soft); margin-top: 8px; font-size: 15px; }
label { display: block; font-size: 13.5px; font-weight: 700; margin-top: 22px; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 16px; padding: 14px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); outline: none; -webkit-appearance: none; }
input:focus { border-color: var(--gold); background: #fff; }
button { width: 100%; margin-top: 14px; min-height: 54px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font: 800 16px "Manrope", sans-serif; cursor: pointer; }
button:disabled { opacity: .5; }
.msg { margin-top: 16px; font-size: 14.5px; padding: 12px 14px; border-radius: 12px; background: var(--gold-bg); }
.msg.erro { background: #fbeeec; color: #8c2a20; }
.link { background: none; color: var(--soft); font: 600 14px "Manrope", sans-serif; margin-top: 10px; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; }
.rodape { margin-top: 18px; font-size: 13.5px; color: var(--soft); }
.rodape a { color: var(--ink); font-weight: 700; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<div class="caixa">
  <a class="marca" href="/">Pode <em>Abrir</em></a>
  <form class="cartao" id="form" novalidate>
    <h1>Entrar</h1>
    <p class="sub">Use o e-mail da compra e a senha que você criou.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="voce@email.com" required>
    <div id="bloco-senha"><label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
    <button id="enviar" type="submit">Entrar</button>
    <p class="msg" id="msg" hidden></p>
    <button type="button" id="trocar" class="link">Esqueci a senha · entrar com link no e-mail</button>
  </form>
  <p class="rodape">Ainda não tem o seu convite? <a href="/">Conheça o Pode Abrir</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const volta = new URLSearchParams(location.search).get("volta");
const destino = volta && volta.startsWith("/") && !volta.startsWith("//") ? volta : "/criar";
// Já está logado? Vai direto.
if (window.SB) SB.auth.getSession().then(({ data }) => { if (data.session) location.replace(destino); });

const msg = document.getElementById("msg");
let modoLink = false;
document.getElementById("trocar").onclick = () => {
  modoLink = !modoLink;
  document.getElementById("bloco-senha").hidden = modoLink;
  document.getElementById("enviar").textContent = modoLink ? "Mandar o link" : "Entrar";
  document.getElementById("trocar").textContent = modoLink ? "Voltar e entrar com senha" : "Esqueci a senha · entrar com link no e-mail";
  document.querySelector(".sub").textContent = modoLink ? "Mandamos um link pro seu e-mail que já entra direto, sem senha." : "Use o e-mail da compra e a senha que você criou.";
  msg.hidden = true;
};
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const btn = document.getElementById("enviar");
  msg.hidden = true; msg.className = "msg";
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = "Digite um e-mail válido."; msg.classList.add("erro"); msg.hidden = false; return; }
  if (!modoLink) {
    btn.disabled = true; btn.textContent = "Entrando…";
    const { error } = await SB.auth.signInWithPassword({ email, password: document.getElementById("senha").value });
    btn.disabled = false; btn.textContent = "Entrar";
    if (!error) return location.replace(destino);
    msg.textContent = "E-mail ou senha incorretos. Se ainda não criou senha, toque em “Esqueci a senha”."; msg.classList.add("erro"); msg.hidden = false;
    return;
  }
  btn.disabled = true; btn.textContent = "Enviando…";
  try {
    const r = await chamarFuncao("enviar-acesso", { email });
    msg.textContent = r.mensagem;
  } catch (err) {
    msg.textContent = err.message || "Não conseguimos enviar agora. Tente de novo."; msg.classList.add("erro");
  }
  msg.hidden = false; btn.disabled = false; btn.textContent = "Mandar de novo";
});
</script>
</body>
</html>
