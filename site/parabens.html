<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f9fafb">
<title>Pagamento aprovado · Pode Abrir</title>
<style>
:root { --bg: #f9fafb; --card: #fff; --line: #e5e7eb; --ink: #111827; --soft: #6b7280; --faint: #9ca3af; --ok: #16a34a; --ok-bg: #ecfdf3; --erro: #b42318; --erro-bg: #fef3f2; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100dvh; }
:focus-visible { outline: 2px solid #9ca3af; outline-offset: 2px; }
.topo { background: #fff; border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #374151; }
.topo svg { width: 17px; height: 17px; color: var(--ok); }
.col { max-width: 440px; margin: 0 auto; padding: 28px 16px calc(40px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid #f3f4f6; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); padding: 26px 20px; }
.selo { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; margin: 0 auto; }
.selo svg { width: 34px; height: 34px; }
h1 { font-size: 23px; font-weight: 800; text-align: center; margin-top: 14px; }
.sub { color: var(--soft); text-align: center; margin-top: 6px; }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 500; color: #374151; margin-top: 14px; }
input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 13px 14px; min-height: 50px; outline: none; -webkit-appearance: none; }
input:focus { border-color: #6b7280; box-shadow: 0 0 0 3px rgba(107,114,128,.15); }
small { font-size: 12px; color: var(--faint); font-weight: 400; }
.olho { position: relative; }
.olho button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--soft); font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; padding: 8px; }
.btn { width: 100%; border: 0; cursor: pointer; color: #fff; font-family: inherit; font-weight: 800; font-size: 15.5px; padding: 16px; border-radius: 12px; min-height: 54px; background: linear-gradient(135deg, #16a34a, #15803d); margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn:disabled { opacity: .6; }
.erro { color: var(--erro); background: var(--erro-bg); border: 1px solid #fecdca; border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
.erro a { color: var(--erro); font-weight: 700; }
.nota { font-size: 13px; color: var(--soft); text-align: center; margin-top: 16px; }
.nota a { color: var(--ink); font-weight: 700; }
.girando { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: gira .7s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="topo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/></svg>Compra Segura</div>
<div class="col">
  <form class="card" id="f" novalidate>
    <div class="selo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Pagamento aprovado!</h1>
    <p class="sub">Crie sua conta pra montar o convite. Use o mesmo e-mail da compra.</p>
    <label>Seu nome<input id="nome" type="text" autocomplete="name" placeholder="Como quer ser chamada"></label>
    <label>E-mail da compra<input id="email" type="email" inputmode="email" autocomplete="username" placeholder="seu@email.com"></label>
    <label>Crie uma senha<span class="olho"><input id="senha" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><button type="button" id="ver">Mostrar</button></span></label>
    <button class="btn" id="ir" type="submit">Criar conta e montar meu convite</button>
    <p class="erro" id="erro" hidden></p>
    <p class="nota">Já tem conta? <a href="/entrar">Entrar</a></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/pixel.js"></script>
<script src="/js/api.js"></script>
<script>
// Igual ao /parabens do ViralFlow: signUp com o e-mail da compra e a compra é
// ligada à conta pelo e-mail (ativar_compras = activate_pending_checkout de lá).
const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search);
$("#email").value = (q.get("email") || "").trim();
if (!$("#email").value) $("#email").focus(); else $("#nome").focus();

$("#ver").onclick = () => { const i = $("#senha"); i.type = i.type === "password" ? "text" : "password"; $("#ver").textContent = i.type === "password" ? "Mostrar" : "Ocultar"; };
const erro = (html) => { $("#erro").innerHTML = html; $("#erro").hidden = !html; };

$("#f").onsubmit = async (e) => {
  e.preventDefault();
  const nome = $("#nome").value.trim();
  const email = $("#email").value.trim().toLowerCase();
  const senha = $("#senha").value;
  erro("");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return erro("E-mail inválido.");
  if (senha.length < 6) return erro("A senha precisa ter pelo menos 6 caracteres.");
  if (!window.SB) return erro("Sistema indisponível. Tente de novo em instantes.");

  const btn = $("#ir");
  btn.disabled = true; btn.innerHTML = '<span class="girando"></span>Criando sua conta…';
  const volta = () => { btn.disabled = false; btn.textContent = "Criar conta e montar meu convite"; };
  try {
    const { data: comprou, error: e1 } = await SB.rpc("tem_compra", { p_email: email });
    if (e1) throw e1;
    if (!comprou) { volta(); return erro("Não encontramos compra aprovada com esse e-mail. Confira se é o mesmo do pagamento. No Pix, pode levar até 1 minuto pra confirmar: tente de novo em instantes."); }

    const { data, error } = await SB.auth.signUp({ email, password: senha, options: { data: { nome } } });
    if (error) {
      volta();
      if (/already|registered|exists/i.test(error.message)) return erro('Você já tem conta com esse e-mail. <a href="/entrar">Entre aqui</a> com a sua senha.');
      return erro(error.message);
    }
    if (!data.session) {
      const { error: e2 } = await SB.auth.signInWithPassword({ email, password: senha });
      if (e2) { volta(); return erro('Conta criada. <a href="/entrar">Entre aqui</a> com o e-mail e a senha.'); }
    }
    await SB.rpc("ativar_compras");
    location.replace("/criar");
  } catch (err) {
    volta(); erro(err.message || "Não deu certo. Tente de novo.");
  }
};
</script>
</body>
</html>
