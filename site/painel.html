<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f1e9">
<title>Confirmações · Pode Abrir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #f6f1e9; --card: #fffdf9; --line: #e4dacb; --ink: #1f1a14; --soft: #6f6456; --faint: #9c8f7e; --gold: #9a7a46; --gold-bg: #f3e8d4; --ok: #2f6b3a; --ok-bg: #e3efe2; --erro: #9b3b2f; --erro-bg: #f3e2df; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
.topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.marca { font-family: "Instrument Serif", serif; font-size: 24px; text-decoration: none; color: var(--ink); }
.marca em { color: var(--gold); }
.topo nav { display: flex; gap: 14px; font-size: 14px; font-weight: 700; }
.topo nav a, .topo nav button { color: var(--soft); text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; }
h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(36px, 8vw, 48px); line-height: 1.02; margin-top: 26px; }
.sub { color: var(--soft); margin-top: 6px; }
.link { display: flex; gap: 8px; margin-top: 16px; }
.link input { flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 14px; min-height: 48px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 14px "Manrope", sans-serif; border-radius: 12px; padding: 0 16px; min-height: 48px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.escuro { background: var(--ink); color: #fff; border-color: var(--ink); }
.totais { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 22px; }
.totais div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 8px; text-align: center; }
.totais b { display: block; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.totais span { font-size: 12.5px; color: var(--soft); font-weight: 700; }
.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }
.filtros { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.filtros button { border: 0; background: none; font: 700 13px "Manrope", sans-serif; padding: 8px 14px; border-radius: 999px; color: var(--soft); cursor: pointer; }
.filtros button.on { background: var(--ink); color: #fff; }
.busca { flex: 1; min-width: 160px; font: inherit; font-size: 15px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 16px; min-height: 42px; }
.lista { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.resp { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.resp:last-child { border-bottom: 0; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--gold-bg); color: var(--gold); display: grid; place-items: center; font-weight: 800; flex: none; }
.resp .meio { flex: 1; min-width: 0; }
.resp b { font-weight: 700; }
.resp small { display: block; color: var(--faint); font-size: 12.5px; }
.resp q { display: block; color: var(--soft); font-size: 14.5px; margin-top: 4px; quotes: "\201C" "\201D"; }
.tag { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.tag.sim { background: var(--ok-bg); color: var(--ok); }
.tag.nao { background: var(--erro-bg); color: var(--erro); }
.apagar { border: 0; background: none; color: var(--faint); font-size: 12px; cursor: pointer; margin-top: 6px; text-decoration: underline; }
.vazio { padding: 40px 20px; text-align: center; color: var(--soft); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><a class="marca" href="/">Pode <em>Abrir</em></a><nav><a href="/criar">Editar convite</a><button type="button" onclick="sair()">Sair</button></nav></div>
  <h1 id="titulo">Quem vem</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div class="link" id="caixa-link" hidden><input id="link" readonly aria-label="Link do convite"><button class="btn" id="copiar" type="button">Copiar</button></div>

  <div class="totais"><div><b id="t-sim">0</b><span>confirmaram</span></div><div><b id="t-pessoas">0</b><span>pessoas</span></div><div><b id="t-nao">0</b><span>não vão</span></div></div>

  <div class="barra">
    <div class="filtros" id="filtros"><button type="button" data-f="todos" class="on">Todos</button><button type="button" data-f="sim">Vão</button><button type="button" data-f="nao">Não vão</button></div>
    <input class="busca" id="busca" type="search" placeholder="Buscar nome" aria-label="Buscar nome">
    <button class="btn" id="baixar" type="button">Baixar lista</button>
    <button class="btn" id="atualizar" type="button">Atualizar</button>
  </div>
  <div class="lista" id="lista"><div class="vazio">Carregando…</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let todos = [], filtro = "todos", convite = null;

function quando(iso) {
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 60) return `há ${Math.max(1, min)} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2200); }

function pintar() {
  const sim = todos.filter(r => r.vai);
  $("#t-sim").textContent = sim.length;
  $("#t-pessoas").textContent = sim.reduce((a, r) => a + r.pessoas, 0);
  $("#t-nao").textContent = todos.length - sim.length;
  const q = $("#busca").value.trim().toLowerCase();
  const lista = todos.filter(r => (filtro === "todos" || (filtro === "sim") === r.vai) && (!q || r.nome.toLowerCase().includes(q)));
  $("#lista").innerHTML = lista.length ? lista.map(r => `
    <div class="resp">
      <span class="av">${esc(r.nome.trim()[0] || "?").toUpperCase()}</span>
      <div class="meio"><b>${esc(r.nome)}</b><small>${quando(r.criado_em)}</small>${r.recado ? `<q>${esc(r.recado)}</q>` : ""}
        <button class="apagar" type="button" data-apagar="${r.id}">Apagar resposta</button></div>
      <span class="tag ${r.vai ? "sim" : "nao"}">${r.vai ? (r.pessoas > 1 ? r.pessoas + " pessoas" : "1 pessoa") : "Não vai"}</span>
    </div>`).join("")
    : `<div class="vazio">${todos.length ? "Ninguém com esse filtro." : "Ainda ninguém respondeu. Mande o link no WhatsApp!"}</div>`;
  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = async () => {
    if (b.dataset.certeza !== "1") { b.dataset.certeza = "1"; b.textContent = "Toque de novo para apagar"; return; }
    try { await API.apagarConfirmacao(b.dataset.apagar); todos = todos.filter(r => r.id !== b.dataset.apagar); pintar(); toast("Resposta apagada"); }
    catch (e) { toast("Não deu pra apagar agora"); }
  });
}

async function carregar() {
  try {
    const r = await API.confirmacoes();
    convite = r.convite; todos = r.lista || [];
    if (!convite) { $("#sub").textContent = "Não achamos um convite nesta conta."; $("#lista").innerHTML = ""; return; }
    const d = convite.dados || {};
    $("#titulo").textContent = d.nome1 ? `${d.nome1} & ${d.nome2}` : "Quem vem";
    if (convite.publicado && convite.slug) {
      $("#sub").textContent = "Respostas do convite de vocês.";
      $("#link").value = CONFIG.SITE + "/" + convite.slug; $("#caixa-link").hidden = false;
    } else $("#sub").innerHTML = 'O convite ainda não foi publicado. <a href="/criar">Terminar de montar</a>';
    pintar();
  } catch (e) {
    console.error(e); $("#lista").innerHTML = '<div class="vazio">Não conseguimos carregar. Toque em Atualizar.</div>';
  }
}

$("#filtros").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filtro = b.dataset.f; document.querySelectorAll("#filtros button").forEach(x => x.classList.toggle("on", x === b)); pintar(); };
$("#busca").oninput = pintar;
$("#atualizar").onclick = carregar;
$("#copiar").onclick = async () => { try { await navigator.clipboard.writeText($("#link").value); toast("Link copiado"); } catch (_) { $("#link").select(); } };
$("#baixar").onclick = () => {
  const linhas = [["Nome", "Vai", "Pessoas", "Recado", "Respondeu em"]].concat(
    todos.map(r => [r.nome, r.vai ? "Sim" : "Não", r.pessoas, r.recado || "", new Date(r.criado_em).toLocaleString("pt-BR")]));
  const csv = "﻿" + linhas.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "confirmacoes.csv"; a.click();
};

(async () => { if (!window.API) { $("#sub").textContent = "Sistema ainda não configurado."; return; } if (await exigirLogin("/painel")) carregar(); })();
</script>
</body>
</html>
